# Configure, build and test the project the way the dev container does.
#
# The point of this workflow is that it runs the tests. A job that only
# compiled, or only checked formatting, would report green while proving
# nothing about the library's behaviour - and this repository's test suite is
# unusual enough that skipping half of it is easy to do by accident:
#
#   * tests/true_*.cpp are executables registered with add_test() and run by
#     ctest;
#   * tests/fail_*.cpp are files that MUST NOT compile. They hang off the
#     custom target `check-compile-fails`, which is not part of `all`, so
#     `cmake --build` alone never touches them. The dedicated step below builds
#     that target on purpose.
#
# scripts/check_before_push.py runs exactly these steps locally.

name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / GCC 14 / Debug
    runs-on: ubuntu-latest
    # A hung test would otherwise hold a runner for six hours.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Report the runner image
        run: |
          set -eux
          . /etc/os-release && echo "$PRETTY_NAME"
          cmake --version

      # The dev container pins g++-14 (see .devcontainer/Dockerfile), and the
      # sources use C++23 well past what the runner's default GCC accepts.
      - name: Install GCC 14
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 gcc-14 ccache

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-gcc14-${{ github.sha }}
          restore-keys: |
            ccache-linux-gcc14-

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake --preset linux-default -D CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset linux-default

      # The negative tests: every tests/fail_*.cpp must be rejected by the
      # compiler. `sh -c "! g++ ..."` inverts the exit status, so this step is
      # red exactly when a file that should not compile does.
      - name: Check that the fail_*.cpp cases still do not compile
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake --build build --target check-compile-fails

      - name: Test
        run: ctest --preset linux-default

  # A second platform is only worth having if it is dependable, and this
  # repository is the cheapest possible case for one: a header-only library
  # with no third-party dependencies at all, so the Windows job is a compiler
  # and nothing else. It runs the repository's own scripts/build_windows.ps1 -
  # the same entry point a developer uses on Windows - which imports the MSVC
  # environment, configures the windows-msvc-release preset, builds, and runs
  # ctest.
  windows:
    name: Windows / MSVC / Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The preset uses the Ninja generator. Visual Studio ships a ninja, but
      # only with an optional component and not on PATH, so it is installed
      # explicitly rather than hoped for.
      - name: Install Ninja
        run: pip install ninja

      # The fail_*.cpp cases are deliberately not repeated here. build_windows.ps1
      # imports the MSVC environment into its own process, so a later step no
      # longer has cl.exe on PATH - and check-compile-fails asserts that
      # compilation FAILS, which is exactly what a missing compiler produces.
      # The step would pass on every commit while testing nothing, which is a
      # worse outcome than checking those cases on Linux alone.
      - name: Build and test
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows.ps1
